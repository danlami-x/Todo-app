version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: todo_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: tododb
      MYSQL_USER: todo_user
      MYSQL_PASSWORD: todopass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 5

  app:
    build: .
    container_name: todo_fastapi
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8009:8009"
    environment:
      DATABASE_URL: mysql+pymysql://todo_user:todopass@db:3306/tododb
    volumes:
      - .:/app
    command: >
      sh -c "sleep 5 && uvicorn main:app --host 0.0.0.0 --port 8009 --reload"

volumes:
  mysql_data:
